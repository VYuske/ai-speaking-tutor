[project]
name = "ai-speaking-tutor-api"
version = "0.1.0"
description = "Local, model-agnostic speaking tutor API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sqlmodel>=0.0.22,<1",
  "pyyaml>=6.0,<7",
  "numpy>=2.0,<3",
  # Romanização determinística dos aids de leitura (AST-045): tabelas locais, sem LLM.
  "pykakasi>=2.2,<3",
  "pypinyin>=0.53,<1",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0,<2"]
tts = [
  "kokoro>=0.9.2",
  "soundfile>=0.12,<1",
  # Kokoro não tem voz alemã: Piper (VITS em onnxruntime, CPU) cobre o `de`.
  "piper-tts>=1.8,<2",
  # Kokoro's own dependency only pulls misaki[en]; ja/zh phonemizers come from these extras.
  "misaki[ja,zh]>=0.9.2,<0.10",
  # misaki's English G2P loads en_core_web_sm at runtime and, when the model is missing,
  # calls `spacy.cli.download` (needs pip, downloads over the network, then SystemExit).
  # The model is not on PyPI anymore, so pin the official release wheel instead.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  # Direto (e não só transitivo via kokoro) para que [tool.uv.sources] escolha o wheel CPU.
  "torch>=2.0,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Áudio roda na CPU (sem NVIDIA Container Toolkit): o wheel padrão do PyPI arrastaria
# ~3 GB de CUDA para a imagem. O índice explícito só é usado para resolver o `torch`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

# O extra `tts` referencia o wheel oficial do en_core_web_sm (não está no PyPI).
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["models: requires local model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
