id: courier-pickup
language: zh
level: [1, 3]
title: "在快递驿站取件"
title_pt: "Retirando encomenda no ponto de entrega"
persona: "快递驿站的小哥，动作快，习惯用手机查单号"
setting: "下班后的快递驿站，门口堆着很多包裹"
goal: "说明来取件，提供取件码，并确认包裹是自己的"
opening_line: "你好，取件还是寄件？"
success_criteria:
  - "说明是来取件的"
  - "提供了取件码"
  - "确认了包裹是自己的"
vocab_targets:
  - 取件
  - 取件码
  - 包裹
  - 手机号
guardrails:
  - "保持驿站工作人员的角色"
  - "角色扮演中不要纠正语法"
