id: garbage-sorting
language: ja
level: [2, 5]
title: "ごみの分別を大家さんに聞く"
title_pt: "Perguntando ao locador sobre a separação do lixo"
persona: "大家さんの森さん。親切ですが、決まりにはきちんと厳しい人です"
setting: "アパートの共用部分。明日は燃えるごみの日ですが、分別が分かりません"
