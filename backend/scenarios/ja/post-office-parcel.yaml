id: post-office-parcel
language: ja
level: [1, 4]
title: "郵便局で荷物を送る"
title_pt: "Enviando um pacote no correio"
persona: "窓口の渡辺さん。慣れた様子で、必要なことを順番に聞きます"
setting: "午後の郵便局。実家に服を送りたいのですが、送り方が分かりません"
