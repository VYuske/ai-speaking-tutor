  - "送り方の種類を選んだ"
  - "料金と日数を確認した"
vocab_targets:
  - 小包
  - 速達
  - 送り先
  - 着払い
guardrails:
  - "窓口係役を続ける"
  - "ロールプレイ中に文法を直さない"
